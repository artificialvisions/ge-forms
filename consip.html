<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GE Healthcare - Moduli CONSIP</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f5f5; }
        .app-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .header { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 20px; }
        .ge-logo { width: 80px; height: 80px; background: #522398; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 32px; }
        .header-text h1 { color: #522398; font-size: 28px; margin-bottom: 5px; }
        .header-text p { color: #666; font-size: 14px; }
        .upload-section { background: white; padding: 30px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .upload-area { border: 2px dashed #522398; border-radius: 8px; padding: 40px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .upload-area:hover { background: #f9f5fc; border-color: #6b2fb5; }
        .upload-area.dragover { background: #f0e6f7; border-color: #6b2fb5; }
        .upload-icon { font-size: 48px; color: #522398; margin-bottom: 15px; }
        .upload-text { color: #333; font-size: 16px; margin-bottom: 10px; }
        .upload-hint { color: #999; font-size: 14px; }
        .file-input { display: none; }
        .status-message { padding: 15px; border-radius: 6px; margin-top: 15px; display: flex; align-items: center; gap: 10px; }
        .status-message.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .status-message.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .status-message.info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        .tabs-container { background: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
        .tabs-header { display: flex; border-bottom: 2px solid #e0e0e0; }
        .tab { flex: 1; padding: 20px; background: #f5f5f5; border: none; cursor: pointer; font-size: 16px; font-weight: 600; color: #666; transition: all 0.3s; }
        .tab:hover { background: #ebebeb; }
        .tab.active { background: white; color: #522398; border-bottom: 3px solid #522398; }
        .tab-content { padding: 30px; }
        .form-section { margin-bottom: 30px; }
        .form-section h3 { color: #522398; margin-bottom: 15px; font-size: 18px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { color: #333; font-weight: 600; margin-bottom: 8px; font-size: 14px; }
        .form-group input, .form-group textarea { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; font-family: inherit; transition: border-color 0.3s; }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #522398; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .items-table { overflow-x: auto; margin-top: 20px; }
        .items-table table { width: 100%; border-collapse: collapse; background: white; }
        .items-table th { background: #522398; color: white; padding: 12px; text-align: left; font-weight: 600; font-size: 14px; }
        .items-table td { padding: 10px 12px; border: 1px solid #e0e0e0; }
        .items-table input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        .items-table input:focus { outline: none; border-color: #522398; }
        .add-item-btn { background: #522398; color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.3s; margin-top: 15px; }
        .add-item-btn:hover { background: #6b2fb5; }
        .delete-btn { background: #dc3545; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .delete-btn:hover { background: #c82333; }
        .export-section { margin-top: 30px; padding-top: 20px; border-top: 2px solid #e0e0e0; }
        .export-btn { background: #28a745; color: white; padding: 15px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: 600; transition: background 0.3s; }
        .export-btn:hover { background: #218838; }
        .export-btn:disabled { background: #ccc; cursor: not-allowed; }
        .checkbox-group { display: flex; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .checkbox-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .checkbox-group input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const App = () => {
            const [activeTab, setActiveTab] = useState(0);
            const [isLoading, setIsLoading] = useState(false);
            const [statusMessage, setStatusMessage] = useState(null);
            const [ddtData, setDdtData] = useState(null);
            
            const [sharedData, setSharedData] = useState({
                billTo: '', shipTo: '', dataConsegna: '', numOdA: '', dataOrdine: '',
                vsProtocollo: '', cigNr: '', cupNr: '', nsProtocollo: '', gonNr: '',
                nrProgInstall: '', tecnicoNome: '', tecnicoCognome: '',
                items: []
            });

            const [installazioneExtra, setInstallazioneExtra] = useState({
                clienteNome: '', clienteCognome: '',
                dichiarazioneConformita: true, schedaMisure: false, altre: false
            });

            const [collaudoExtra, setCollaudoExtra] = useState({
                garanzia: '',
                dichiarazioneConformita: true, schedaMisure: false, altre: false
            });

            const [formazioneExtra, setFormazioneExtra] = useState({
                partecipanti: [
                    { nome: '', cognome: '', qualifica: '' },
                    { nome: '', cognome: '', qualifica: '' },
                    { nome: '', cognome: '', qualifica: '' },
                    { nome: '', cognome: '', qualifica: '' },
                    { nome: '', cognome: '', qualifica: '' }
                ]
            });

            const extractDDTData = (text) => {
                const data = { billTo: '', shipTo: '', cigNr: '', cupNr: '', poNr: '', gonNr: '', ddtNumber: '', items: [] };

                // Helper per formattare date in italiano gg/mm/aaaa
                const formatDateIT = (dateStr) => {
                    if (!dateStr) return '';
                    if (dateStr.includes('/')) return dateStr;
                    const parts = dateStr.split('-');
                    if (parts.length === 3) return parts[2] + '/' + parts[1] + '/' + parts[0];
                    return dateStr;
                };
                window._formatDateIT = formatDateIT;
                
                // BILL TO
                const intestatarioPos = text.indexOf('Intestatario Fattura');
                if (intestatarioPos > 0) {
                    const afterIntestario = text.substring(intestatarioPos + 20);
                    const untilCodice = afterIntestario.split('Codice Fiscale')[0];
                    const allNumbers = [...untilCodice.matchAll(/\b(\d{7,8})\b/g)];
                    if (allNumbers.length > 0) {
                        const lastNumber = allNumbers[allNumbers.length - 1];
                        const clientCode = lastNumber[1];
                        const codePos = lastNumber.index + clientCode.length;
                        const afterCode = untilCodice.substring(codePos);
                        const billToMatch = afterCode.match(/\s*([A-Z][^]*?Italy)/i);
                        if (billToMatch) data.billTo = billToMatch[1].replace(/\s+/g, ' ').trim();
                    }
                }
                
                // SHIP TO
                const shipToMatch = text.match(/Destinazione\s+\d+\s+([^]+?)(?:Ordine Cliente|DDT Numero|SO Numero)/is);
                if (shipToMatch) data.shipTo = shipToMatch[1].replace(/\s+/g, ' ').trim();
                
                // PO, GON, DDT
                const poMatch = text.match(/Ordine Cliente\s+([A-Z0-9\-]+)/i);
                if (poMatch) data.poNr = poMatch[1].trim();
                const gonMatch = text.match(/SO Numero\s+(\d+)/i);
                if (gonMatch) data.gonNr = gonMatch[1].trim();
                const ddtMatch = text.match(/DDT Numero\s+(\d+)/i);
                if (ddtMatch) data.ddtNumber = ddtMatch[1].trim();
                
                // CIG e CUP
                const referenteSection = text.match(/REFERENTE\s+CIG\s+CUP\s+RESA\s+CAUSALE DEL TRASPORTO\s+([^]+?)(?:RIGA|CODICE ARTICOLO)/is);
                if (referenteSection) {
                    const tokens = referenteSection[1].split(/\s+/).filter(t => t.length >= 2);
                    const validTokens = tokens.map(t => t.replace(/[(),]/g, '')).filter(t => {
                        if (t === 'NA') return true;
                        if (/[a-z]/.test(t)) return false;
                        if (/^[A-Z0-9]{5,}$/.test(t)) return true;
                        return false;
                    });
                    if (validTokens.length >= 2) {
                        data.cigNr = validTokens[0];
                        data.cupNr = validTokens[1];
                    }
                }
                
                // Items
                const itemsSectionMatch = text.match(/(?:MATRICOLA|LOTTO)\s+([\s\S]+?)(?:COMMENTI|NUMERO COLLI|Referente|$)/i);
                if (itemsSectionMatch) {
                    const itemsText = itemsSectionMatch[1];
                    const pattern = /([A-Z][A-Z0-9]{5,14})\s+(.+?)\s+EA\s+(\d+)\s*([A-Z0-9\-]{6,})?/gi;
                    let match;
                    while ((match = pattern.exec(itemsText)) !== null) {
                        const itemNumber = match[1];
                        let description = match[2].trim().replace(/\s+/g, ' ');
                        const qty = match[3];
                        let serialNumber = match[4] || '';
                        if (serialNumber && (serialNumber === 'COMMENTI' || serialNumber.length < 6 || 
                            serialNumber.startsWith('FG') || serialNumber.includes('NUMERO') ||
                            serialNumber.includes('PESO') || serialNumber.includes('ASPETTO') ||
                            serialNumber.includes('LOTTO'))) {
                            serialNumber = '';
                        }
                        data.items.push({ itemNumber, description, qty, serialNumber });
                    }
                }
                return data;
            };

            const parsePDF = async (file) => {
                setIsLoading(true);
                setStatusMessage({ type: 'info', text: 'Analisi del documento in corso...' });
                try {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    const extractedData = extractDDTData(fullText);
                    setDdtData(extractedData);
                    
                    // Popola lo state condiviso (sincronizzato su tutte le tab)
                    setSharedData(prev => ({
                        ...prev,
                        billTo: extractedData.billTo, shipTo: extractedData.shipTo,
                        cigNr: extractedData.cigNr, cupNr: extractedData.cupNr,
                        gonNr: extractedData.gonNr, nsProtocollo: extractedData.gonNr,
                        items: extractedData.items.map((item, index) => ({
                            qty: item.qty,
                            codiceConsip: index === 0 ? 'AQ-CASECOM-L7-GE' : '',
                            codiceH: item.itemNumber,
                            descrizione: item.description,
                            serialNumber: item.serialNumber
                        }))
                    }));
                    setStatusMessage({ type: 'success', text: `✓ DDT caricato! Trovati ${extractedData.items.length} articoli.` });
                } catch (error) {
                    console.error('Errore:', error);
                    setStatusMessage({ type: 'error', text: 'Errore durante l\'analisi del documento.' });
                } finally {
                    setIsLoading(false);
                }
            };

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (file && file.type === 'application/pdf') parsePDF(file);
                else setStatusMessage({ type: 'error', text: 'Carica un file PDF valido.' });
            };

            const handleDragOver = (e) => { e.preventDefault(); e.currentTarget.classList.add('dragover'); };
            const handleDragLeave = (e) => { e.preventDefault(); e.currentTarget.classList.remove('dragover'); };
            const handleDrop = (e) => {
                e.preventDefault();
                e.currentTarget.classList.remove('dragover');
                const file = e.dataTransfer.files[0];
                if (file && file.type === 'application/pdf') parsePDF(file);
            };

            const updateSharedField = (field, value) => setSharedData(prev => ({ ...prev, [field]: value }));
            const updateItem = (index, field, value) => {
                setSharedData(prev => {
                    const newItems = [...prev.items];
                    newItems[index] = { ...newItems[index], [field]: value };
                    return { ...prev, items: newItems };
                });
            };
            const addItem = () => {
                setSharedData(prev => ({
                    ...prev,
                    items: [...prev.items, {
                        qty: '', codiceConsip: 'AQ-CASECOM-DE-DE-L7-GE',
                        codiceH: '', descrizione: '', serialNumber: ''
                    }]
                }));
            };
            const deleteItem = (index) => {
                setSharedData(prev => ({
                    ...prev,
                    items: prev.items.filter((_, i) => i !== index)
                }));
            };

            // Extra per tab specifiche
            const updateInstallazioneExtra = (field, value) => setInstallazioneExtra(prev => ({ ...prev, [field]: value }));
            const updateCollaudoExtra = (field, value) => setCollaudoExtra(prev => ({ ...prev, [field]: value }));
            const updateFormazioneExtra = (field, value) => setFormazioneExtra(prev => ({ ...prev, [field]: value }));

            const updatePartecipante = (index, field, value) => {
                setFormazioneExtra(prev => {
                    const newPartecipanti = [...prev.partecipanti];
                    newPartecipanti[index] = { ...newPartecipanti[index], [field]: value };
                    return { ...prev, partecipanti: newPartecipanti };
                });
            };
            const addPartecipante = () => {
                setFormazioneExtra(prev => ({
                    ...prev,
                    partecipanti: [...prev.partecipanti, { nome: '', cognome: '', qualifica: '' }]
                }));
            };
            const deletePartecipante = (index) => {
                setFormazioneExtra(prev => ({
                    ...prev,
                    partecipanti: prev.partecipanti.filter((_, i) => i !== index)
                }));
            };

            const exportPDF = () => {
                if (!sharedData.billTo || !sharedData.shipTo ||
                    !sharedData.dataConsegna || !sharedData.numOdA || !sharedData.dataOrdine ||
                    !sharedData.vsProtocollo || !sharedData.cigNr || !sharedData.cupNr ||
                    !sharedData.nsProtocollo || !sharedData.nrProgInstall) {
                    alert('Compila tutti i campi obbligatori prima di esportare il PDF!');
                    return;
                }
                
                if (sharedData.items.length === 0) {
                    alert('Aggiungi almeno un articolo prima di esportare il PDF!');
                    return;
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(10);
                doc.setFont(undefined, 'bold');
                doc.text('GE Medical Systems Italia S.p.A.', 15, 15);
                doc.setFontSize(12);
                doc.text('Verbale di Installazione del Sistema', 15, 22);
                
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('GE Medical Systems Italia S.p.A', 15, 28);
                doc.text('Via Galeno 36, 20126 Milano', 15, 32);
                doc.text('Tel: +39 02 26001 111', 15, 36);
                
                doc.setDrawColor(0);
                doc.setLineWidth(0.5);
                doc.rect(120, 10, 85, 25);
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('CONVENZIONE CONSIP', 122, 16);
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('AQ Dotazioni tecnologiche per le Case di Comunità', 122, 21);
                doc.setFont(undefined, 'bold');
                doc.text('LOTTO 7 - Ecografo', 122, 28);
                
                let y = 45;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Cliente', 15, y);
                y += 5;
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('NOME: ' + (sharedData.billTo || ''), 15, y);
                y += 10;
                doc.text('VIA: ' + (sharedData.shipTo || ''), 15, y);
                
                y += 8;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Dettagli Ordine', 15, y);
                y += 5;
                doc.setFontSize(7);
                doc.setFont(undefined, 'normal');
                
                const dettagli = [
                    ['Num. OdA progressivo:', sharedData.numOdA],
                    ['Data Ordine:', window._formatDateIT(sharedData.dataOrdine)],
                    ['Vs. Protocollo:', sharedData.vsProtocollo],
                    ['CIG:', sharedData.cigNr],
                    ['CUP:', sharedData.cupNr],
                    ['Ns. Prot. e GON:', sharedData.nsProtocollo],
                    ['Nr.Prog. Install GE:', sharedData.nrProgInstall]
                ];
                
                dettagli.forEach(([label, value]) => {
                    doc.text(label, 15, y);
                    doc.text(value || '', 60, y);
                    y += 4;
                });
                
                y += 2;
                doc.text('Data consegna:', 15, y);
                doc.text(window._formatDateIT(sharedData.dataConsegna) || '', 60, y);
                
                y += 8;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Si è proceduto all\'accettazione e collaudo delle seguenti apparecchiature:', 15, y);
                y += 5;
                
                const tableData = sharedData.items.map(item => [
                    item.qty, item.codiceConsip,
                    item.codiceH, item.descrizione, item.serialNumber
                ]);
                
                doc.autoTable({
                    startY: y,
                    head: [['Q.tà', 'Codice Consip', 'Codice Hxx', 'Descrizione', 'nr. serie']],
                    body: tableData,
                    styles: { fontSize: 7, cellPadding: 2 },
                    headStyles: { fillColor: [82, 35, 152], textColor: 255, fontStyle: 'bold' },
                    columnStyles: {
                        0: { cellWidth: 15 }, 1: { cellWidth: 40 },
                        2: { cellWidth: 25 }, 3: { cellWidth: 65 }, 4: { cellWidth: 35 }
                    }
                });
                
                y = doc.lastAutoTable.finalY + 10;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('ALLEGATI:', 15, y);
                y += 5;
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                const allegati = [];
                if (installazioneExtra.dichiarazioneConformita) allegati.push('DICHIARAZIONE DI CONFORMITÀ');
                if (installazioneExtra.schedaMisure) allegati.push('SCHEDA MISURE');
                if (installazioneExtra.altre) allegati.push('ALTRE');
                if (allegati.length > 0) doc.text('[X] ' + allegati.join(', '), 15, y);
                
                y += 10;
                doc.setFontSize(7);
                doc.text('Il Cliente provvederà a verificare l\'efficienza dell\'impianto di terra e monte del Sistema ed a mantenerla nel tempo.', 15, y);
                
                y += 8;
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('Tecnico installatore: ______________________________', 15, y);
                
                y += 10;
                doc.setFontSize(8);
                doc.setFont(undefined, 'bold');
                doc.text('*Per la Casa Fornitrice', 15, y);
                doc.text('*Timbro e firma del Cliente', 120, y);
                
                doc.save('Verbale_Installazione_CONSIP.pdf');
            };

            const exportCollaudoPDF = () => {
                if (!sharedData.billTo || !sharedData.shipTo ||
                    !sharedData.dataConsegna || !sharedData.numOdA || !sharedData.dataOrdine ||
                    !sharedData.vsProtocollo || !sharedData.cigNr || !sharedData.cupNr ||
                    !sharedData.nsProtocollo || !sharedData.nrProgInstall) {
                    alert('Compila tutti i campi obbligatori prima di esportare il PDF!');
                    return;
                }
                if (sharedData.items.length === 0) {
                    alert('Aggiungi almeno un articolo prima di esportare il PDF!');
                    return;
                }
                
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFontSize(10);
                doc.setFont(undefined, 'bold');
                doc.text('GE Medical Systems Italia S.p.A.', 15, 15);
                doc.setFontSize(12);
                doc.text('Verbale di Collaudo', 15, 22);
                
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('GE Medical Systems Italia S.p.A', 15, 28);
                doc.text('Via Galeno 36, 20126 Milano', 15, 32);
                doc.text('Tel: +39 02 26001 111', 15, 36);
                
                doc.setDrawColor(0);
                doc.setLineWidth(0.5);
                doc.rect(120, 10, 85, 25);
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('CONVENZIONE CONSIP', 122, 16);
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('AQ Dotazioni tecnologiche per le Case di Comunità', 122, 21);
                doc.setFont(undefined, 'bold');
                doc.text('LOTTO 7 - Ecografo', 122, 28);
                
                let y = 45;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Cliente', 15, y);
                y += 5;
                doc.setFontSize(8);
                doc.setFont(undefined, 'normal');
                doc.text('NOME: ' + (sharedData.billTo || ''), 15, y);
                y += 10;
                doc.text('VIA: ' + (sharedData.shipTo || ''), 15, y);
                
                y += 8;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Dettagli Ordine', 15, y);
                y += 5;
                doc.setFontSize(7);
                doc.setFont(undefined, 'normal');
                
                const dettagliC = [
                    ['Num. OdA progressivo:', sharedData.numOdA],
                    ['Data Ordine:', window._formatDateIT(sharedData.dataOrdine)],
                    ['Vs. Protocollo:', sharedData.vsProtocollo],
                    ['CIG:', sharedData.cigNr],
                    ['CUP:', sharedData.cupNr],
                    ['Ns. Prot. e GON:', sharedData.nsProtocollo],
                    ['Nr.Prog. Install GE:', sharedData.nrProgInstall],
                    ['Garanzia:', collaudoExtra.garanzia || '24 mesi']
                ];
                
                dettagliC.forEach(([label, value]) => {
                    doc.text(label, 15, y);
                    doc.text(value || '', 60, y);
                    y += 4;
                });
                
                y += 2;
                doc.text('Data consegna:', 15, y);
                doc.text(window._formatDateIT(sharedData.dataConsegna) || '', 60, y);
                
                y += 8;
                doc.setFontSize(9);
                doc.setFont(undefined, 'bold');
                doc.text('Si è proceduto al collaudo delle seguenti apparecchiature:', 15, y);
                y += 5;
                
                const tableDataC = sharedData.items.map(item => [
                    item.qty, item.codiceConsip,
                    item.codiceH, item.descrizione, item.serialNumber
                ]);

                                                    <label>Ns. Protocollo e GON</label>
                                                    <input type="text" value={sharedData.nsProtocollo}
                                                           onChange={(e) => updateSharedField('nsProtocollo', e.target.value)} />
                                                </div>
                                                <div className="form-group">
                                                    <label>Nr.Prog. Install GE</label>
                                                    <input type="text" placeholder="numero case"
                                                           value={sharedData.nrProgInstall}
                                                           onChange={(e) => updateSharedField('nrProgInstall', e.target.value)} />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="export-section">
                                            <button className="export-btn" onClick={exportFormazionePDF}
                                                    disabled={sharedData.items.length === 0}>
                                                📥 Esporta PDF Verbale Formazione
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
